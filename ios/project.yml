name: tlx
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  DEVELOPMENT_TEAM: ${TLX_TEAM_ID}
packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.0
targets:
  tlx:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [Sources, Assets.xcassets]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${TLX_BUNDLE_ID}
      INFOPLIST_FILE: Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.2"
      CURRENT_PROJECT_VERSION: 6
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1,2"
      "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "6"
      "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac.entitlements
    dependencies:
      - framework: Core.xcframework
        embed: false
      - package: swift-nio-ssh
        product: NIOSSH
  tlxTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [Tests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${TLX_BUNDLE_ID}.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: tlx
schemes:
  tlx:
    build:
      targets:
        tlx: all
    test:
      targets: [tlxTests]
