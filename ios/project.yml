name: tlx
options:
  bundleIdPrefix: com.achempion
  deploymentTarget:
    iOS: "17.0"
packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.0
targets:
  tlx:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      INFOPLIST_FILE: Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: 4
      DEVELOPMENT_TEAM: N3LZFHNRZJ
      TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - framework: Core.xcframework
        embed: false
      - package: swift-nio-ssh
        product: NIOSSH
  tlxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: tlx
schemes:
  tlx:
    build:
      targets:
        tlx: all
    test:
      targets: [tlxTests]
